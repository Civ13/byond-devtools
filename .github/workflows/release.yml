name: Release

# Pushing a tag such as v0.1.0 runs the tests, packages the VS Code preview and
# publishes a GitHub release with the .vsix attached. The tag must match
# vscode/package.json's version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # Microsoft Entra sign-in for the Marketplace (no stored token)

jobs:
  release:
    runs-on: ubuntu-latest
    # A fixed environment gives the Entra federated credential one subject for every tag
    # (GitHub's ID form): repo:Civ13@41390861/byond-devtools@1449711083:environment:release
    environment: release
    timeout-minutes: 20
    env:
      # Publishing is optional: each step runs only when its variable or secret is set.
      # The Marketplace uses Microsoft Entra sign-in (variables AZURE_CLIENT_ID and
      # AZURE_TENANT_ID, a federated credential for the release environment); no token is stored.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tag matches the extension version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but vscode/package.json is $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm test
      - name: Package the .vsix
        working-directory: vscode
        run: |
          npm ci --no-audit --no-fund
          npm run package
          mv byond-map-preview.vsix "byond-map-preview-$VERSION.vsix"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/VERSION/$VERSION/g" .github/release-notes.md > notes.md
          # A re-run keeps the release it already made.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "Release $GITHUB_REF_NAME already exists"; exit 0; }
          gh release create "$GITHUB_REF_NAME" "vscode/byond-map-preview-$VERSION.vsix" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      # Open VSX goes first, so a Marketplace sign-in problem does not hold it back.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: vscode
        shell: bash # -o pipefail, so the tee below keeps ovsx's exit status
        run: |
          # The first publish needs the civ13 namespace; it already exists after that.
          npx --yes ovsx@1.2.0 create-namespace civ13 -p "$OVSX_PAT" || echo "Namespace civ13 already exists"
          # A re-run skips a version Open VSX already has.
          npx --yes ovsx@1.2.0 publish "byond-map-preview-$VERSION.vsix" -p "$OVSX_PAT" 2>&1 | tee ovsx.log || {
            grep -q "already published" ovsx.log && echo "Open VSX already has $VERSION" || exit 1; }
      - name: Sign in to Microsoft Entra
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the Visual Studio Marketplace
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        working-directory: vscode
        run: npx vsce publish --no-dependencies --azure-credential --skip-duplicate --packagePath "byond-map-preview-$VERSION.vsix"
