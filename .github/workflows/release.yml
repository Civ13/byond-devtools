name: Release

# Pushing a tag such as v0.1.0 runs the tests, packages the VS Code preview and
# publishes a GitHub release with the .vsix attached. The tag must match
# vscode/package.json's version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Marketplace tokens are optional: each publish step runs only when its secret is set.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tag matches the extension version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but vscode/package.json is $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm test
      - name: Package the .vsix
        working-directory: vscode
        run: |
          npm ci --no-audit --no-fund
          npm run package
          mv byond-map-preview.vsix "byond-map-preview-$VERSION.vsix"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/VERSION/$VERSION/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" "vscode/byond-map-preview-$VERSION.vsix" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode
        run: npx vsce publish --no-dependencies --packagePath "byond-map-preview-$VERSION.vsix"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: vscode
        run: npx --yes ovsx@1.2.0 publish "byond-map-preview-$VERSION.vsix" -p "$OVSX_PAT"
